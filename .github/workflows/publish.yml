name: Publish release (bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 parts into .github/bootstrap/
# (the-wrong-place.apk.b64.partN; the .sha256 file is uploaded LAST).
# This workflow reassembles it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages (web version = index.html) with main.
# It does NOT build or sign anything.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

env:
  VER: v0.1.1
  APK_SHA256: 1c6b6760a7c683bcf96cb8490e280c3565e85c119fad79fcaa5f7b72a8019aea

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          ls .github/bootstrap/the-wrong-place.apk.b64.part* >/dev/null 2>&1 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/the-wrong-place.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          ls -l .github/bootstrap
          cat $(ls .github/bootstrap/the-wrong-place.apk.b64.part* | sort -V) | base64 -d > /tmp/p/the-wrong-place.apk
          printf '%s  /tmp/p/the-wrong-place.apk\n' "$(cut -d' ' -f1 .github/bootstrap/the-wrong-place.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/the-wrong-place.apk\n' "$APK_SHA256" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/the-wrong-place.apk || exit 0
          gh release view "$VER" >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «The Wrong Place» 0.1.1

          - Бег и стамина для обеих сторон, полоска стамины, анимация бега; боты бегают.
          - Шкафчики, следы бегущих (видит только убийца), музыка и красные края при погоне, «последний шанс» у ворот.
          - Погода и события матча: туман, гроза с молниями, отключение света.
          - Новые персонажи: убийцы Пустой Пастух и Они (тотемы, телепорт, рывок, души самураев), выжившие Итан Коул и Лили Марш.
          - Новое лобби и интерфейс, разнесённые генераторы, крюки и декорации, здания с нормальными входами.
          - Баланс убийц 35–50% на всех картах (боты).

          Android 7.0+, versionCode 2 / versionName 0.1.1, пакет com.luntikvisuals.wrongplace (та же подпись, что у 0.1.0).
          SHA-256: 1c6b6760a7c683bcf96cb8490e280c3565e85c119fad79fcaa5f7b72a8019aea
          Некоммерческий фанатский проект, вдохновлён Dead by Daylight.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create "$VER" /tmp/p/the-wrong-place.apk --target main --latest --title "The Wrong Place $VER" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/the-wrong-place.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          git rm -q -r .github/bootstrap
          git commit -m "Remove $VER bootstrap payload (APK published in Release $VER)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          if git fetch origin gh-pages; then
            git checkout -B gh-pages origin/gh-pages
            git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main ($VER)" || true
            if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          else
            git checkout -B gh-pages "$MAIN"
          fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Enable / rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || printf 'Pages site exists or cannot be created with this token.\n'
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
