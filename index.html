'use strict';
/* ===== b_core: constants, RNG, helpers, definitions, synth audio ===== */
const T=32, FW=40, FH=30;
const WP={dbg:{crossFloor:0,nan:0,wallClip:0,log:[]},G:null,ver:'0.1-прототип'};
let RS=1;
function srand(s){RS=(s>>>0)||1}
function rnd(){RS=(RS+0x6D2B79F5)>>>0;let t=RS;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}
const rr=(a,b)=>a+rnd()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1)), pick=a=>a[Math.floor(rnd()*a.length)];
const fr=(a,b)=>a+Math.random()*(b-a); // visual-only randomness
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
const tc=v=>Math.floor(v/T), cc=t=>t*T+T/2;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---- synthesized audio (WebAudio, no files) ---- */
const AU={ctx:null,master:null,on:true,lastBeat:0,
 init(){if(this.ctx||!this.on)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=0.6;this.master.connect(this.ctx.destination);this.drone()}catch(e){this.ctx=null}},
 env(node,t0,a,d,peak){const g=this.ctx.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);node.connect(g);g.connect(this.master);return g},
 tone(freq,dur,type,vol,slide){if(!this.ctx)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);this.env(o,t,0.01,dur,vol||0.3);o.start(t);o.stop(t+dur+0.05)},
 noise(dur,vol,lp){if(!this.ctx)return;const t=this.ctx.currentTime,n=Math.floor(this.ctx.sampleRate*dur),b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=this.ctx.createBufferSource();s.buffer=b;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||1200;s.connect(f);this.env(f,t,0.005,dur,vol||0.3);s.start(t)},
 beat(vol){if(!this.ctx)return;const t=this.ctx.currentTime;[0,0.16].forEach((dt,i)=>{const o=this.ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(i?52:62,t+dt);o.frequency.exponentialRampToValueAtTime(30,t+dt+0.15);this.env(o,t+dt,0.008,0.18,vol*(i?0.7:1));o.start(t+dt);o.stop(t+dt+0.3)})},
 drone(){const t=this.ctx.currentTime;[41,61.7].forEach(f=>{const o=this.ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;const g=this.ctx.createGain();g.gain.value=0.035;o.connect(lp);lp.connect(g);g.connect(this.master);o.start(t)})},
 sfx(n){if(!this.ctx)return;switch(n){
  case'hit':this.noise(0.25,0.5,900);this.tone(180,0.25,'square',0.15,60);break;
  case'scream':this.tone(880,0.7,'sawtooth',0.08,320);this.tone(660,0.7,'triangle',0.08,250);break;
  case'hook':this.tone(120,0.5,'square',0.2,40);this.noise(0.4,0.3,500);break;
  case'gen':this.tone(220,0.4,'square',0.12,440);this.tone(330,0.6,'triangle',0.12,660);break;
  case'gate':[0,1,2].forEach(i=>setTimeout(()=>this.tone(300+i*120,0.3,'square',0.1),i*150));break;

  case'stun':this.noise(0.3,0.5,400);this.tone(90,0.3,'square',0.2,40);break;

 }}
};

/* --- c_map.js --- */
/* ===== c_map: per-floor tile grids, map builders, pathfinding (BFS + stair edges), line of sight ===== */
const TI={FLOOR:0,WALL:1,GAP:2,STAIR:3,GRASS:4,FENCE:5,TREE:6,HOUSE:7,GATE:8,DECK:9,WATER:10,FIELD:11,VOID:12,ROAD:13};
const SOLID=new Uint8Array(16);[1,5,6,7,8,10,12].forEach(t=>SOLID[t]=1);
const OPAQUE=new Uint8Array(16);[1,2,6,7,12].forEach(t=>OPAQUE[t]=1);
const idx=(x,y)=>y*FW+x;

function mkFloor(name,fill,pal,outdoor){return{name,g:new Uint8Array(FW*FH).fill(fill),blk:new Uint8Array(FW*FH),pal,outdoor:!!outdoor,deco:[],rugs:[]}}
function border(F,t){for(let x=0;x<FW;x++){F.g[idx(x,0)]=t;F.g[idx(x,FH-1)]=t}for(let y=0;y<FH;y++){F.g[idx(0,y)]=t;F.g[idx(FW-1,y)]=t}}

/* House-like floor: 4x3 room grid, doors (1 wide), survivor-only gaps, optional open halls */
function roomFloor(F,seedF,openP,wallT){
 wallT=wallT||TI.WALL;
 const xs=[0,10,20,30,FW-1], ys=[0,10,20,FH-1];
 for(const x of xs)for(let y=0;y<FH;y++)F.g[idx(x,y)]=wallT;
 for(const y of ys)for(let x=0;x<FW;x++)F.g[idx(x,y)]=wallT;
 F.doors=[];F.rooms=[];
 for(let r=0;r<3;r++)for(let c=0;c<4;c++)F.rooms.push({x0:xs[c]+1,x1:xs[c+1]-1,y0:ys[r]+1,y1:ys[r+1]-1});
 let opened=0;
 const seg=(cells)=>{ // cells: list of [x,y] of an internal wall segment (excluding posts)
  if(opened<2&&rnd()<openP){opened++;for(const[x,y]of cells)F.g[idx(x,y)]=F.floorT;return}
  const di=ri(1,cells.length-2),[dx,dy]=cells[di];F.g[idx(dx,dy)]=F.floorT;F.doors.push({x:dx,y:dy,vert:cells[0][0]===cells[1][0]});
  if(rnd()<0.5){let gi=ri(1,cells.length-2),n=0;while(Math.abs(gi-di)<2&&n++<20)gi=ri(1,cells.length-2);if(Math.abs(gi-di)>=2){const[gx,gy]=cells[gi];F.g[idx(gx,gy)]=TI.GAP}}
 };
 for(const x of [10,20,30])for(let r=0;r<3;r++){const c=[];for(let y=ys[r]+1;y<ys[r+1];y++)c.push([x,y]);seg(c)}
 for(const y of [10,20])for(let k=0;k<4;k++){const c=[];for(let x=xs[k]+1;x<xs[k+1];x++)c.push([x,y]);seg(c)}
}
function passK(F,x,y,kind){if(x<0||y<0||x>=FW||y>=FH)return false;const i=idx(x,y),t=F.g[i];if(SOLID[t])return false;if(t===TI.GAP&&kind!=='s')return false;if(F.blk[i]===1)return false;return true}
function floodCount(F,kind,sx,sy){const seen=new Uint8Array(FW*FH),q=[idx(sx,sy)];seen[q[0]]=1;let n=0;while(q.length){const i=q.pop();n++;const x=i%FW,y=(i/FW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(passK(F,nx,ny,kind)){const j=idx(nx,ny);if(!seen[j]){seen[j]=1;q.push(j)}}}}return n}
function countPass(F,kind){let n=0;for(let y=0;y<FH;y++)for(let x=0;x<FW;x++)if(passK(F,x,y,kind))n++;return n}
function firstPass(F){for(let y=1;y<FH;y++)for(let x=1;x<FW;x++)if(passK(F,x,y,'k'))return[x,y]}
function stillConnected(F){const p=firstPass(F);return floodCount(F,'k',p[0],p[1])===countPass(F,'k')&&floodCount(F,'s',p[0],p[1])===countPass(F,'s')}

function buildMap(kind){
 srand(kind==='mansion'?1337:kind==='village'?4242:9090);
 const M={kind,floors:[],stairs:[],gens:[],hooks:[],furn:[],items:[],gates:[],reserved:new Set(),spawnK:null,spawnS:[]};
 const res=(f,x,y)=>M.reserved.add(f*10000+idx(x,y)), isRes=(f,x,y)=>M.reserved.has(f*10000+idx(x,y));
 const link=(fa,xa,ya,ady,fb,xb,yb,bdy,la,lb)=>{
  const A={f:fa,x:xa,y:ya,ax:xa,ay:ya+ady,label:la},B={f:fb,x:xb,y:yb,ax:xb,ay:yb+bdy,label:lb};A.to=B;B.to=A;
  M.stairs.push(A,B);for(const s of[A,B]){const F=M.floors[s.f];F.g[idx(s.x,s.y)]=TI.STAIR;const at=F.g[idx(s.ax,s.ay)];if(SOLID[at]||at===TI.GAP||at===TI.STAIR)F.g[idx(s.ax,s.ay)]=F.outdoor&&F.pal!=='deck'?TI.GRASS:(F.floorT||TI.FLOOR);res(s.f,s.x,s.y);res(s.f,s.ax,s.ay)}
 };
 const yard=(F)=>{border(F,TI.FENCE)};
 if(kind==='mansion'){
  M.name='Особняк';
  const Y=mkFloor('Двор',TI.GRASS,'yard',true);yard(Y);M.floors.push(Y);
  for(let y=1;y<=11;y++)for(let x=11;x<=28;x++)Y.g[idx(x,y)]=TI.HOUSE;
  const names=['1 этаж · Холл','2 этаж · Спальни','3 этаж · Библиотека','Чердак'],pals=['hall','bed','lib','attic'];
  for(let f=1;f<=4;f++){const F=mkFloor(names[f-1],TI.FLOOR,pals[f-1]);F.floorT=TI.FLOOR;roomFloor(F,f,0.22);M.floors.push(F)}
  // entrances (yard <-> 1st floor) and two staircases between each pair of floors
  link(0,15,12,1,1,15,28,-1,'В дом','Во двор');
  link(0,24,12,1,1,25,28,-1,'В дом','Во двор');
  for(let f=1;f<=3;f++){
   link(f,1+2*(f-1),1,1,f+1,2+2*(f-1),1,1,'Вверх','Вниз');
   link(f,38-2*(f-1),28,-1,f+1,37-2*(f-1),28,-1,'Вверх','Вниз');
  }
  M.gates.push({f:0,tiles:[[0,14],[0,15]],x:cc(1),y:15*T,side:-1,prog:0,open:false,name:'Западные ворота'});
  M.gates.push({f:0,tiles:[[FW-1,14],[FW-1,15]],x:cc(FW-2),y:15*T,side:1,prog:0,open:false,name:'Восточные ворота'});
  for(const g of M.gates)for(const[x,y]of g.tiles){Y.g[idx(x,y)]=TI.GATE;res(0,x+(g.side<0?1:-1),y);res(0,x+(g.side<0?2:-2),y)}
  M.genSpots=[[0,8,21],[1,5,15],[2,25,5],[3,15,24],[4,34,15]];
  M.hookSpots=[[0,5,6],[0,34,6],[0,7,26],[0,32,26],[0,20,22],[1,34,5],[2,6,24],[3,24,14],[4,15,5]];
  M.spawnK={f:0,x:20,y:16};
  M.spawnS=[[0,3,27],[0,36,27],[2,15,15],[3,35,24],[4,5,24],[1,15,5]];
  // yard trees & hedges
  for(let n=0;n<60;n++){const x=ri(2,FW-3),y=ri(14,FH-3);if(Math.abs(x-20)<3&&y<20)continue;if(Y.g[idx(x,y)]===TI.GRASS&&!isRes(0,x,y))Y.g[idx(x,y)]=TI.TREE}
  for(let n=0;n<14;n++){const x=ri(2,10)+(rnd()<0.5?0:27),y=ri(2,12);if(Y.g[idx(x,y)]===TI.GRASS&&!isRes(0,x,y))Y.g[idx(x,y)]=TI.TREE}
 } else { buildAscii(M,kind,res,isRes,link) }
 for(const[f,x,y]of[...M.genSpots,...M.hookSpots,...M.spawnS,[M.spawnK.f,M.spawnK.x,M.spawnK.y]]){const F=M.floors[f];if(SOLID[F.g[idx(x,y)]]||F.g[idx(x,y)]===TI.GAP)F.g[idx(x,y)]=F.outdoor?TI.GRASS:F.floorT;res(f,x,y);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(passK(F,x+dx,y+dy,'k'))res(f,x+dx,y+dy)}

 o=o||{};const d=e.def,K=e.side==='k',P=K?2.6:2;const face=o.face!=null?o.face:e.face;

 if(K&&d.id==='rotjaw'){c.fillStyle=C(shade(d.body,-0.3));for(let i=0;i<3;i++)c.fillRect(bx+P+i*3*P,byy+P,P,bh-2*P)}
 // arms

  if(K&&d.id==='rotjaw'){c.fillStyle=C('#3a0a0a');c.fillRect(fxp-P,fyp+fh*0.7,fw+P*2,P*3);c.fillStyle=C('#e8e0b0');for(let i=0;i<fw+P*2;i+=P*1.5){c.fillRect(fxp-P+i,fyp+fh*0.7,P*0.7,P);c.fillRect(fxp-P+i+P*0.6,fyp+fh*0.7+P*2,P*0.7,P)}}

  if(pose==='down'||pose==='hooked'||pose==='hit'){c.fillStyle='#a0101a';c.fillRect(fxp+P,fyp+fh-P,P,P)}

  gensDone:0,needGens:Math.min(4,M.gens.length),powered:false,collapse:-1,collapseBy:'',over:false,result:null,seed:o.seed,sim:!!o.sim,
  ev:{hooks:0,kills:0,escapes:0,downs:0,hits:0,stuns:0,knocks:0,vaults:0,unhooks:0,revives:0,stairs:0,gates:0,abil:0,blinds:0,pulls:0,pounces:0,veils:0,whispers:0,heals:0,wiggleOut:0,crossFloorHits:0,breaks:0}};

 for(const e of G.ents){e.stats.floors.add(e.f);if(o.playerSide===e.side&&!G.player&&(e.side==='k'||e.def.id===o.playerChar)){e.isPlayer=true;G.player=e}else e.bot=mkBot(e,G)}

function say(G,txt,col){G.msgs.push({txt,t:4,col:col||'#f0e0c0'});if(G.msgs.length>5)G.msgs.shift()}
function shakeAt(G,e,a){if(G.view&&G.view.f===e.f&&dist(G.view,e)<400)G.shake=Math.max(G.shake,a)}

/* ---- shared trajectory: walk a line until wall/solid; used by aim preview AND projectiles/dashes ---- */
function traceLine(G,e,ang,range,rad){
 const M=G.M,dx=Math.cos(ang),dy=Math.sin(ang),step=4;let x=e.x,y=e.y,d=0;
 while(d<range){const nx=x+dx*step,ny=y+dy*step;
  if(rad?!circleFree(M,e.f,nx,ny,rad,'k'):solidAt(M,e.f,tc(nx),tc(ny),'k')||OPAQUE[M.floors[e.f].g[idx(tc(nx),tc(ny))]])break;
  x=nx;y=ny;d+=step}
 return{x0:e.x,y0:e.y,x1:x,y1:y,len:d,ang};
}
/* first survivor touched along a trace (same floor only) */
function traceHit(G,e,tr,w){
 let best=null,bd=1e9;for(const s of G.surv){if(s.f!==e.f||s.st!=='ok'||s.climb)continue;
  const dx=tr.x1-tr.x0,dy=tr.y1-tr.y0,L2=dx*dx+dy*dy||1,t=clamp(((s.x-tr.x0)*dx+(s.y-tr.y0)*dy)/L2,0,1),px=tr.x0+dx*t,py=tr.y0+dy*t;
  if(Math.hypot(s.x-px,s.y-py)<w+s.r&&t*Math.sqrt(L2)<bd){bd=t*Math.sqrt(L2);best=s}}
 return best;
}
/* Ability geometry: returns shape object used for drawing the aim AND executing. */
function abShape(G,e,i,ang){
 const ab=e.side==='k'?e.def.ab[i]:e.def.ab,M=G.M;
 switch(ab.id){
  case'rope':{const tr=traceLine(G,e,ang,ab.range,0);return{type:'ray',tr,hit:traceHit(G,e,tr,8),ab}}
  case'veil':{const tr=traceLine(G,e,ang,ab.range,0);return{type:'proj',tr,hit:traceHit(G,e,tr,14),ab}}
  case'pounce':{const tr=traceLine(G,e,ang,ab.range,e.r);return{type:'dash',tr,hit:traceHit(G,e,tr,e.r),ab}}
  case'rip':return{type:'ring',x:e.x,y:e.y,r:ab.radius,ab};
  case'sense':return{type:'ring',x:e.x,y:e.y,r:60,ab,global:true};
  case'whisper':{let tg=null,bd=ab.range;for(const s of G.surv)if(s.f===e.f&&s.st==='ok'&&!s.climb){const d=dist(e,s);if(d<bd){bd=d;tg=s}}return{type:'target',x:e.x,y:e.y,r:ab.range,target:tg,ab}}
  case'shot':{let tg=null,bd=ab.range;for(const s of G.surv)if(s!==e&&s.f===e.f&&s.st==='ok'&&s.hp<s.maxhp){const d=dist(e,s);if(d<bd){bd=d;tg=s}}if(!tg&&e.hp<e.maxhp)tg=e;return{type:'circle',x:e.x,y:e.y,r:ab.range,target:tg,ab}}
  case'overload':{let tg=null,bd=ab.range+20;for(const g of M.gens)if(g.f===e.f&&!g.done){const d=dist(e,g);if(d<bd){bd=d;tg=g}}return{type:'circle',x:e.x,y:e.y,r:ab.range,target:tg,ab}}
  case'sprint':{const tr=traceLine(G,e,ang,ab.range,0);return{type:'arrow',tr,ab}}
  case'hide':return{type:'ring',x:e.x,y:e.y,r:24,ab};
  case'lamp':{const K=G.killer;let hit=null;if(K.f===e.f&&K.vanish<=0&&!K.climb){const d=dist(e,K);if(d<ab.range+K.r&&Math.abs(angDiff(ang,Math.atan2(K.y-e.y,K.x-e.x)))<ab.half&&los(M,e.f,e.x,e.y,K.x,K.y))hit=K}return{type:'cone',x:e.x,y:e.y,ang,r:ab.range,half:ab.half,hit,ab}}
 }
}
function canCast(G,e,i){if(e.cd[i]>0||e.stun>0||e.climb||(e.act&&!HOLD[e.act.type])||e.vanish>0||e.pounce)return false;if(e.side==='s'&&e.st!=='ok')return false;if(e.side==='k'&&e.carry&&i!==undefined&&e.def.ab[i].id!=='rip'&&e.def.ab[i].id!=='sense')return false;return true}
function castAbility(G,e,i,ang){
 if(!canCast(G,e,i))return false;
 const sh=abShape(G,e,i,ang),ab=sh.ab;let ok=true;
 switch(ab.id){
  case'rope':G.proj.push({kind:'rope',owner:e,f:e.f,tr:sh.tr,d:0,speed:900,w:8,back:false});break;
  case'veil':G.proj.push({kind:'veil',owner:e,f:e.f,tr:sh.tr,d:0,speed:520,w:14});break;
  case'pounce':e.pounce={tr:sh.tr,d:0,speed:470,hit:false};G.ev.pounces++;break;
  case'rip':e.buff.rip=4;break;
  case'sense':e.buff.sense=6;break;

  case'shot':if(!sh.target){ok=false;break}sh.target.hp=Math.min(sh.target.maxhp,sh.target.hp+30);G.ev.heals++;fxBurst(G,sh.target,'#7fe07f',10);break;
  case'overload':if(!sh.target){ok=false;break}sh.target.boost=10;fxBurst(G,sh.target,'#ffe060',14);break;
  case'sprint':e.buff.sprint=2;e.face=ang;break;
  case'hide':e.buff.hide=6;break;

 }

}

function attackShape(e){return{x:e.x+Math.cos(e.face)*22,y:e.y+Math.sin(e.face)*22,r:24}}

/* ---- furniture ---- */
function knockOver(G,s,fu){

   if(e===K){K.stats.stuns++;stunKiller(G,K,2)}

}
/* move entity out of a blocked doorway tile to the side of reference ent */
function pushOut(G,e,fu,ref){const vert=fuVert(G,fu),cx=cc(fu.fx),cy=cc(fu.fy);let sx=vert?Math.sign(ref.x-cx)||1:0,sy=vert?0:Math.sign(ref.y-cy)||1;

/* ---- interactions: list the best available interaction for an entity ---- */
function interactOptions(G,e){

 const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/6));

 // generators

  } else if(g.regress){g.p=Math.max(0,g.p-dt/300);if(g.p<=0)g.regress=false}
 }

 if(G.collapse>=0){G.collapse-=dt;if(G.collapse<=0){for(const s of G.surv)if(aliveS(s)){if(s.carrier){s.carrier.carry=null;s.carrier=null}for(const h of M.hooks)if(h.victim===s)h.victim=null;s.st='dead';G.ev.kills++;s.collapsed=true}G.collapse=0}}
 // escape

 // invariants

 if(P.side==='k'){B.push({id:'atk',x:W-r*1.5,y:H-r*1.5,r:r*1.15,label:'Атака',col:'#8a1a1a'});B.push({id:'act',x:W-r*3.9,y:H-r*1.0,r:r*0.85,label:'Действие',col:'#4a3a2a'});
  B.push({id:'ab0',x:W-r*1.3,y:H-r*4.0,r:r*0.85,label:P.def.ab[0].name,ab:0,col:'#3a2a5a'});B.push({id:'ab1',x:W-r*3.6,y:H-r*3.2,r:r*0.85,label:P.def.ab[1].name,ab:1,col:'#3a2a5a'})}
 else{B.push({id:'act',x:W-r*1.5,y:H-r*1.5,r:r*1.15,label:'Действие',col:'#2a4a3a'});B.push({id:'ab0',x:W-r*3.9,y:H-r*1.0,r:r*0.85,label:P.def.ab.name,ab:0,col:'#3a2a5a'});B.push({id:'prone',x:W-r*1.3,y:H-r*4.0,r:r*0.75,label:P.prone?'Встать':'Лечь',col:'#3a3a3a'})}
 B.push({id:'pause',x:W-22,y:22,r:16,label:'II',col:'#2a1a1a',small:true});return B}
function hitBtn(G,x,y){for(const b of btnLayout(G))if(Math.hypot(x-b.x,y-b.y)<b.r+6)return b;return null}
function onDown(ev){const G=WP.G;AU.init();if(!G||IN.paused||G.over)return;ev.preventDefault();const x=ev.clientX,y=ev.clientY;if(ev.pointerType==='touch')IN.touch=true;const P=G.player;
 const b=hitBtn(G,x,y);if(b){IN.ptr.set(ev.pointerId,{b,x0:x,y0:y});
  if(b.id==='pause'){pauseGame();return}if(!P||P.st==='dead'||P.st==='out')return;
  if(b.id==='atk')P.in.atk=true;if(b.id==='prone'){if(P.st==='ok'&&!P.act)P.prone=!P.prone}
  if(b.ab!=null)P.aim={i:b.ab,ang:P.face,drag:false};return}
 if(x<R.W*0.55&&!IN.joy){IN.joy={id:ev.pointerId,ox:x,oy:y,x,y};return}
 if(ev.pointerType==='mouse'&&P&&P.side==='k'){P.face=Math.atan2(y-(R.H/2),x-(R.W/2));P.in.atk=true}}
function onMove(ev){const G=WP.G;IN.mouse.x=ev.clientX;IN.mouse.y=ev.clientY;if(!G)return;const P=G.player;
 if(IN.joy&&IN.joy.id===ev.pointerId){IN.joy.x=ev.clientX;IN.joy.y=ev.clientY}
 const p=IN.ptr.get(ev.pointerId);if(p&&p.b.ab!=null&&P&&P.aim){const dx=ev.clientX-p.b.x,dy=ev.clientY-p.b.y;if(Math.hypot(dx,dy)>14){P.aim.ang=Math.atan2(dy,dx);P.aim.drag=true}}
 if(P&&P.aim&&IN.aimKey){P.aim.ang=Math.atan2(IN.mouse.y-(P.y-R.cam.y)*R.S-R.H/2,IN.mouse.x-(P.x-R.cam.x)*R.S-R.W/2)}}
function onUp(ev){const G=WP.G;if(IN.joy&&IN.joy.id===ev.pointerId)IN.joy=null;const p=IN.ptr.get(ev.pointerId);IN.ptr.delete(ev.pointerId);if(!G||!p)return;const P=G.player;
 if(p.b.ab!=null&&P&&P.aim){P.in.cast={i:P.aim.i,ang:P.aim.ang};P.aim=null}}
function onKey(ev,down){const G=WP.G,k=ev.code;if(down)IN.keys.add(k);else IN.keys.delete(k);if(!G||G.over)return;const P=G.player;if(down)AU.init();
 if(down&&k==='Escape'){IN.paused?resumeGame():pauseGame();return}if(!P||IN.paused)return;
 if(down&&!ev.repeat){if(k==='KeyC'&&P.side==='s'&&P.st==='ok'&&!P.act)P.prone=!P.prone;if((k==='KeyJ'||(k==='Space'&&P.side==='k')))P.in.atk=true;
  if(k==='KeyQ'||k==='KeyR'||k==='KeyF'){const i=k==='KeyQ'||P.side==='s'?0:1;P.aim={i,ang:P.face};IN.aimKey=k;onMove({clientX:IN.mouse.x,clientY:IN.mouse.y,pointerId:-9})}}
 if(!down&&IN.aimKey===k&&P.aim){P.in.cast={i:P.aim.i,ang:P.aim.ang};P.aim=null;IN.aimKey=null}
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))ev.preventDefault()}
function applyInput(G){const P=G.player;if(!P)return;let mx=0,my=0;const K=IN.keys;
 if(K.has('KeyW')||K.has('ArrowUp'))my-=1;if(K.has('KeyS')||K.has('ArrowDown'))my+=1;if(K.has('KeyA')||K.has('ArrowLeft'))mx-=1;if(K.has('KeyD')||K.has('ArrowRight'))mx+=1;
 let run=!(K.has('ShiftLeft')||K.has('ShiftRight'));
 if(IN.joy){const dx=IN.joy.x-IN.joy.ox,dy=IN.joy.y-IN.joy.oy,R0=50,d=Math.hypot(dx,dy);if(d>6){mx=dx/Math.max(d,R0);my=dy/Math.max(d,R0);run=d>R0*0.6}}
 P.in.mx=mx;P.in.my=my;P.in.run=run;
 let act=K.has('KeyE')||(P.side==='s'&&K.has('Space'));for(const p of IN.ptr.values())if(p.b.id==='act')act=true;P.in.act=act;
 if(P.aim&&!IN.aimKey&&!IN.ptr.size)P.aim=null;
}

 else if(opts.length)lbl=opts[0].label+(IN.touch?'':' [E]');
 if(P.st==='carried'){lbl='Вырывайтесь! (держите Действие)';pr=P.wig}else if(P.st==='hooked'){lbl='Вы на крюке… ждите помощи';pr=P.hookT/(P.hookN===1?60:35)}else if(P.st==='down'){lbl='Вы ранены и ползёте';pr=1-P.downT/120}
 if(lbl){c.font='bold 14px sans-serif';const w=Math.max(160,c.measureText(lbl).width+30);hudBox(c,W/2-w/2,H-76,w,pr!=null?40:26,0.75);c.fillStyle='#f3e3c0';c.textAlign='center';c.fillText(lbl,W/2,H-63);if(pr!=null){c.fillStyle='#300';c.fillRect(W/2-w/2+10,H-50,w-20,6);c.fillStyle='#e0b040';c.fillRect(W/2-w/2+10,H-50,(w-20)*clamp(pr,0,1),6)}}

const SET={side:'s',killer:'stitches',surv:'nora',map:'mansion',diff:1};
const UI=()=>document.getElementById('ui');
function charCanvas(side,id,sz){const cv=document.createElement('canvas');cv.width=sz;cv.height=sz;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;const def=side==='k'?KILLERS[id]:SURVS[id];const e={side,def,face:Math.PI*0.4,walk:0,item:null};c.scale(sz/48,sz/48);drawChar(c,e,24,side==='k'?44:42,'idle',0);return cv}
function showLore(){UI().innerHTML=`<div class="panel"><h2>История</h2><div class="lore">Каждый год в Америке бесследно исчезают тысячи людей. Полиция пишет «ушёл из дома», семьи клеят листовки. Но некоторые из пропавших просыпаются в <b>Стране Чудес</b> — мире, как две капли воды похожем на наш. Те же дома, те же дороги… только места здесь свои: особняк, где лестницы ведут не туда, деревня без жителей, корабль, который никуда не плывёт.<br><br>Этим миром правит <b>Хозяин</b>. Его никто не видел, но его слуги — Мистер Стежок, Бледная Невеста и Гнилая Челюсть — охотятся на новеньких и вешают их на крюки. Хозяин забирает тех, кто провисел слишком долго.<br><br>Говорят, если запустить старые генераторы, ворота наружу оживут. Говорят, кто-то даже вернулся.</div><button id="bk">Назад</button></div>`;document.getElementById('bk').onclick=showMenu}
function showHow(){UI().innerHTML=`<div class="panel"><h2>Как играть</h2><div class="lore"><b>Выжившие:</b> почините 4 генератора из 5, откройте ворота во дворе и сбегите. Опрокидывайте тумбы и шкафы в дверные проёмы — если убийца под ними, он оглушён. Пролезайте в щели в стенах (убийца не пролезет). Ложитесь, чтобы вас было хуже видно. Снимайте друзей с крюков.<br><b>Убийца:</b> бейте выживших, поднимайте упавших и вешайте на крюки. Третий крюк — смерть.<br><b>Сердце</b> над выжившим значит, что убийца рядом (на этом же этаже).<br><br><b>Телефон:</b> левая половина экрана — джойстик, справа кнопки. Способность: зажмите кнопку и тяните палец — видно траекторию, отпустите — применить.<br><b>Клавиатура:</b> WASD — ходьба, Shift — шагом, E — действие, Пробел — атака/действие, ЛКМ или J — атака, Q/R — способности (зажать и целиться мышью), C — лечь, Esc — пауза.</div><button id="bk">Назад</button></div>`;document.getElementById('bk').onclick=showMenu}
function showSetup(){const u=UI();const sel=(a,b)=>a===b?' sel':'';
 u.innerHTML=`<div class="panel"><h2>Новая охота</h2><div class="row"><button id="sS" class="${SET.side==='s'?'sel':''}">Играть за выжившего</button><button id="sK" class="${SET.side==='k'?'sel':''}">Играть за убийцу</button></div>

 <div class="row"><button data-m="mansion" class="${sel('mansion',SET.map)}">Особняк (4 этажа + двор)</button><button data-m="village" class="${sel('village',SET.map)}">Деревня (упрощ.)</button><button data-m="ship" class="${sel('ship',SET.map)}">Корабль (упрощ.)</button></div>

function startGame(o){o=o||{};const ids=Object.keys(SURVS);let surv;
 if(SET.side==='s'){surv=[SET.surv,...shuffleM(ids.filter(i=>i!==SET.surv)).slice(0,3)]}else surv=shuffleM(ids.slice()).slice(0,4);
 const G=newMatch({map:SET.map,killer:SET.side==='k'?SET.killer:(o.killer||Object.keys(KILLERS)[(Math.random()*3)|0]),surv,playerSide:SET.side,playerChar:SET.surv,diff:SET.diff,seed:o.seed});
 R.lastF=-1;R.cam.x=G.view.x;R.cam.y=G.view.y;UI().className='hide';IN.paused=false;G.endShown=false;say(G,SET.side==='k'?'Охота началась. Найди их.':'Почини генераторы и выберись!','#ffd890');return G}
function shuffleM(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function showEnd(G){const r=G.result,P=G.player;let title;const rew=grantReward(G);
 if(P&&P.side==='k')title=r.kills>=3?'Хозяин доволен':r.kills===2?'Ничья. Хозяин молчит':'Они ушли…';else if(P)title=P.st==='out'?'Вы выбрались!':'Хозяин забрал вас';else title='Матч окончен';
 const rows=G.surv.map(s=>`<tr><td>${s.def.name}</td><td>${s.st==='out'?'сбежал(а)':'погиб(ла)'}</td><td>${s.stats.gens} ген.</td><td>${s.stats.unhooks} спас.</td></tr>`).join('');
 const u=UI();u.className='';u.innerHTML=`<div class="panel"><h1 style="font-size:32px">${title}</h1><div class="sub">${G.killer.def.name} · убито ${r.kills} · сбежало ${r.escapes} · награда ◉ ${rew} · ${Math.floor(r.time/60)}:${String(Math.floor(r.time%60)).padStart(2,'0')}</div><table style="margin:auto;font-size:14px">${rows}</table><div class="row"><button id="again">Ещё раз</button><button id="mm">Меню</button></div></div>`;
 document.getElementById('again').onclick=()=>startGame();document.getElementById('mm').onclick=()=>{WP.G=null;showMenu()}}

/* ===== n_boot: canvas, main loop, public API (incl. headless bot-vs-bot simulation for tests) ===== */
function resize(){const cv=R.cv;R.dpr=Math.min(2,window.devicePixelRatio||1);R.W=window.innerWidth;R.H=window.innerHeight;cv.width=Math.round(R.W*R.dpr);cv.height=Math.round(R.H*R.dpr);R.c.imageSmoothingEnabled=false}
let lastTS=0,acc=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(0.1,(ts-lastTS)/1000||0);lastTS=ts;const G=WP.G;if(!G||G.sim)return;
 if(!IN.paused&&!G.over){acc+=dt;let n=0;while(acc>=1/60&&n<6){applyInput(G);step(G,1/60);acc-=1/60;n++}if(n>=6)acc=0}
 else if(G.over&&!G.endShown){G.endT=(G.endT||0)+dt;if(G.endT>1.5){G.endShown=true;showEnd(G)}}
 if(!IN.paused)updFxOnly(G,dt);render(G,IN.paused?0:dt);drawHUD(G)}
function updFxOnly(G,dt){if(G.over)updFx(G,dt)}
/* bot-vs-bot match without rendering; returns stats + invariant violations */
WP.sim=function(o){o=o||{};const ids=Object.keys(SURVS);srand(o.seed||1);const surv=o.surv||shuffle(ids.slice()).slice(0,4);
 const dbg0={...WP.dbg};WP.dbg.crossFloor=0;WP.dbg.nan=0;WP.dbg.wallClip=0;
 const G=newMatch({map:o.map||'mansion',killer:o.killer||'stitches',surv,playerSide:null,diff:o.diff==null?1:o.diff,seed:o.seed||1,sim:true});
 const dt=1/30,maxT=o.maxT||1000;const still=new Map(),win=new Map();const stuck=[],dither=[];const floorsK=new Set();let stairCross=0;
 while(!G.over&&G.t<maxT){step(G,dt);floorsK.add(G.killer.f);
  for(const e of G.ents){const b=e.bot;if(!b)continue;const busy=e.act||e.climb||e.stun>0||e.vanish>0||e.pounce||e.pull||(e.side==='s'&&e.st!=='ok'&&e.st!=='down');
   const p=still.get(e)||{x:e.x,y:e.y,t:0};if(b.moveIntent&&!busy&&Math.hypot(e.x-p.x,e.y-p.y)<0.3)p.t+=dt;else p.t=0;p.x=e.x;p.y=e.y;still.set(e,p);
   if(p.t>8){stuck.push({who:e.def.id,f:e.f,x:Math.round(e.x),y:Math.round(e.y),state:b.state,t:Math.round(G.t)});p.t=0}
   // windowed stall: wanted to move for a whole 20 s window but net displacement < 1 tile
   const w=win.get(e)||{x:e.x,y:e.y,f:e.f,fc:false,t0:G.t,mv:0,tr:0,px:e.x,py:e.y};if(e.f===w.f)w.tr+=Math.hypot(e.x-w.px,e.y-w.py);w.px=e.x;w.py=e.y;if(e.f!==w.f){w.fc=true;w.f=e.f}if(b.moveIntent&&!busy)w.mv+=dt;if(G.t-w.t0>=20){if(w.mv>18&&!w.fc&&Math.hypot(e.x-w.x,e.y-w.y)<T&&!(e.side==='s'&&e.st==='down'))(w.tr<6*T?stuck:dither).push({who:e.def.id,f:e.f,x:Math.round(e.x),y:Math.round(e.y),state:b.state,t:Math.round(G.t),stall:true});w.x=e.x;w.y=e.y;w.t0=G.t;w.mv=0;w.fc=false;w.tr=0}win.set(e,w)}
 }
 const r={seed:o.seed,killer:G.killer.def.id,map:G.M.kind,over:G.over,time:Math.round(G.t),result:G.result,gens:G.gensDone,powered:G.powered,collapseBy:G.collapseBy,
  ev:G.ev,stuck,dither,nan:WP.dbg.nan,crossFloor:WP.dbg.crossFloor,wallClip:WP.dbg.wallClip,killerFloors:[...floorsK],survFloors:G.surv.map(s=>[...s.stats.floors]),
  gatesOpened:G.M.gates.filter(g=>g.open).length,hookedNow:G.M.hooks.filter(h=>h.victim).length,mapLog:WP.dbg.log.slice()};
 WP.G=null;return r};
WP.start=(o)=>{Object.assign(SET,o||{});return startGame(o)};
WP.ready=false;
window.addEventListener('load',()=>{R.cv=document.getElementById('cv');R.c=R.cv.getContext('2d');resize();window.addEventListener('resize',resize);
 R.cv.addEventListener('pointerdown',onDown,{passive:false});window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
 window.addEventListener('keydown',e=>onKey(e,true));window.addEventListener('keyup',e=>onKey(e,false));R.cv.addEventListener('contextmenu',e=>e.preventDefault());
 showMenu();requestAnimationFrame(frame);WP.ready=true});
// Android wrapper hooks: system Back = pause/resume in a match, "Назад" in sub-pages, menu after a match; false = let the app close
WP.onBack=()=>{if(WP.G&&!WP.G.over){IN.paused?resumeGame():pauseGame();return true}const bk=document.getElementById('bk');if(bk){bk.click();return true}if(WP.G){WP.G=null;showMenu();return true}return false};
WP.onPause=()=>{if(WP.G&&!WP.G.over&&!IN.paused)pauseGame()};
